<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CRICS Social Image Template</title>
    <style>
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 420px 780px;
        align-items: center;
        background: #121A45;
        color: #FFFFFF;
        font-family: Arial, Helvetica, sans-serif;
      }
      .logo { width: 280px; height: 280px; margin: 175px 70px; object-fit: contain; }
      .copy { padding-right: 70px; }
      h1 { margin: 0 0 24px; font-size: 68px; line-height: 1.05; }
      p { margin: 0; color: #C7D3FE; font-size: 34px; }
    </style>
  </head>
  <body>
    <img class="logo" src="../public/logo-256.png" alt="" />
    <div class="copy">
      <h1>Free offline cricket scoring</h1>
      <p>by eSportZignal</p>
    </div>
  </body>
</html>
